name: Trigger Site Build

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger keithdperez.com rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.SITE_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/keithdperez/keithdperez.com/dispatches \
            -d '{"event_type":"vault-update"}'
