name: Deploy keithdperez.com

# Builds the Astro site from notes in keithdperez/vault marked `publish: true`.
on:
  push:
    branches: [v4]
  repository_dispatch:
    types: [vault-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          repository: keithdperez/vault
          path: .vault
          token: ${{ secrets.VAULT_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          CONTENT_DIR: ${{ github.workspace }}/.vault
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
