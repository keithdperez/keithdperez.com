name: Claude Code Integration

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only run if the comment contains @claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v4  # Always work on v4 branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow Claude to run multiple iterations to complete complex tasks
          claude_args: "--max-turns 10"

      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "Claude Code"
          git config --global user.email "noreply@anthropic.com"

          # Check if there are any changes to commit
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Update from @claude request in issue #${{ github.event.issue.number }}

            🤖 Generated with Claude Code

            Co-Authored-By: ${{ github.event.comment.user.login }} <${{ github.event.comment.user.id }}+${{ github.event.comment.user.login }}@users.noreply.github.com>"
            git push origin v4

            echo "Changes committed and pushed to v4 branch"
          else
            echo "No changes to commit"
          fi
